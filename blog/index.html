<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniUPI Blog — UPI Payments & Payment Gateway</title><meta name="description" content="Latest OmniUPI guides, UPI payment gateway updates, integrations, security tips and payment technology insights."><meta name="robots" content="index,follow"><link rel="canonical" href="https://omniupi.in/blog"><style>body{margin:0;background:#f5f8fc;color:#142033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:50px}.logo{font-weight:900;font-size:22px;color:#0b95bd}.back{color:#5267f3;text-decoration:none;font-size:13px}.hero{text-align:center;margin-bottom:35px}.hero h1{font-size:42px;margin:0 0 10px;letter-spacing:-.04em}.hero p{color:#738095;margin:0;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.card{background:#fff;border:1px solid #e7ebf2;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #1720330b;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 16px 38px #17203315}.img{height:210px;background:#eaf0f6;overflow:hidden}.img img{width:100%;height:100%;object-fit:cover}.body{padding:20px}.meta{font-size:11px;color:#718096;margin-bottom:9px}.card h2{font-size:19px;line-height:1.3;margin:0 0 9px}.card p{font-size:13px;color:#6f7b8d;line-height:1.6;margin:0 0 17px}.read{font-size:12px;font-weight:800;color:#5267f3;text-decoration:none}.empty{text-align:center;padding:70px;color:#7b8798;grid-column:1/-1}.more{text-align:center;margin-top:30px}.more button{border:1px solid #dce2eb;background:#fff;border-radius:10px;padding:11px 18px;cursor:pointer}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.hero h1{font-size:31px}.grid{grid-template-columns:1fr}.nav{margin-bottom:35px}}</style></head><body><main class="wrap"><nav class="nav"><div class="logo">OmniUPI</div><a class="back" href="/">← Back to OmniUPI</a></nav><section class="hero"><h1>OmniUPI Blog</h1><p>Guides, updates and practical insights about UPI payments, payment gateways and online collections.</p></section><section id="grid" class="grid"><div class="empty">Loading latest blogs…</div></section><div class="more"><button id="more" hidden>Load more</button></div></main><script>const API='https://api.omniupi.in/api/v1/blogs';let page=1;async function load(){const r=await fetch(`${API}?page=${page}&limit=12`,{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.message||'Request failed');const grid=document.getElementById('grid');if(page===1)grid.innerHTML='';if(!d.blogs?.length&&page===1){grid.innerHTML='<div class="empty">No published blogs yet.</div>';return}for(const b of d.blogs){const card=document.createElement('article');card.className='card';card.innerHTML=`<div class="img">${b.featuredImage?`<img loading="lazy" src="${esc(b.featuredImage)}" alt="${esc(b.title)}">`:''}</div><div class="body"><div class="meta">${esc(b.category||'General')} · ${date(b.publishedAt)}</div><h2>${esc(b.title)}</h2><p>${esc(b.excerpt||'Read the latest OmniUPI article.')}</p><a class="read" href="/blog/${encodeURIComponent(b.slug)}">Read article →</a></div>`;grid.appendChild(card)}document.getElementById('more').hidden=page>=d.pagination.pages}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(s){return s?new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}document.getElementById('more').onclick=()=>{page++;load()};load().catch(()=>document.getElementById('grid').innerHTML='<div class="empty">Unable to load blogs right now.</div>');</script></body></html>
