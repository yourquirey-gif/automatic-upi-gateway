  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('click', async function(e){
        const button=e.target.closest && e.target.closest('.google-btn');
        if(!button) return;
        e.preventDefault(); e.stopImmediatePropagation();
        const base=(window.__OMNIUPI_API_BASE__||'https://api.omniupi.in/api/v1').replace(/\/$/,'');
        try{
          const r=await fetch(base+'/auth/google/config',{cache:'no-store'}); const d=await r.json();
          if(!r.ok||!d.enabled) throw new Error('Google sign-up is currently disabled by the administrator.');
          location.href=base+'/auth/google';
        }catch(err){
          const box=document.querySelector('.auth-error');
          if(box) box.textContent=err.message; else alert(err.message);
        }
      },true);

      const addLegalLinks=()=>{
        const footer=document.querySelector('.footer');
        if(!footer||footer.querySelector('.footer-legal-links')) return;
        const wrap=document.createElement('div');
        wrap.className='footer-legal-links';
        wrap.innerHTML='<div class="footer-legal-title">Legal & Support</div><a href="#privacy">Privacy Policy</a><a href="#terms">Terms & Conditions</a><a href="#refund">Refund & Cancellation</a><a href="#shipping">Shipping & Delivery</a><a href="#contact">Contact Us</a>';
        footer.insertBefore(wrap,footer.querySelector('.copyright'));
      };
      new MutationObserver(addLegalLinks).observe(document.getElementById('root'),{childList:true,subtree:true});
      addLegalLinks();
    </script>
    <script type="module" src="/src/main.jsx?v=20260817-8"></script>
