<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#665cf1" />
    <meta name="description" content="OmniUPI merchant payment gateway and API platform" />
    <meta name="application-name" content="OmniUPI" />
    <meta property="og:title" content="OmniUPI — UPI Payment Gateway" />
    <meta property="og:description" content="Modern UPI payment infrastructure for businesses." />
    <meta property="og:url" content="https://omniupi.in" />
    <title>OmniUPI — UPI Payment Gateway</title>
    <style>
      .hero-section{overflow:hidden}
      .hero-section:before{content:"";position:absolute;z-index:1;right:5%;top:50%;width:min(46vw,600px);aspect-ratio:800/495;transform:translateY(-43%) rotate(3deg);background:url('/hero-card.svg') center/contain no-repeat;pointer-events:none}
      .hero-copy{z-index:2}
      @media(max-width:1050px){.hero-section{padding-bottom:410px}.hero-section:before{right:50%;top:auto;bottom:38px;width:min(76vw,600px);transform:translateX(50%) rotate(0deg)}}
      @media(max-width:760px){.hero-section{padding-bottom:340px}.hero-section:before{bottom:24px;width:calc(100vw - 40px)}}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      document.addEventListener('click', async function(e){
        const button=e.target.closest && e.target.closest('.google-btn');
        if(!button) return;
        e.preventDefault(); e.stopImmediatePropagation();
        const base=(window.__OMNIUPI_API_BASE__||'https://api.omniupi.in/api/v1').replace(/\/$/,'');
        try{
          const r=await fetch(base+'/auth/google/config',{cache:'no-store'}); const d=await r.json();
          if(!r.ok||!d.enabled) throw new Error('Google sign-up is currently disabled by the administrator.');
          location.href=base+'/auth/google';
        }catch(err){
          const box=document.querySelector('.auth-error');
          if(box) box.textContent=err.message; else alert(err.message);
        }
      },true);
    </script>
    <script type="module" src="/src/main.jsx?v=20260817-5"></script>
  </body>
</html>
