<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniUPI Subscription Checkout</title><style>body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(420px,92vw);background:#fff;border-radius:22px;padding:24px;box-shadow:0 20px 60px #1720331a;text-align:center}.qr{width:240px;height:240px;margin:16px auto}.upi{background:#f7f9fb;padding:12px;border-radius:12px;text-align:left;font-size:13px}.status{margin:14px 0;padding:11px;border-radius:10px;background:#f7f9fb;font-size:12px}.ok{background:#effbf6;color:#167354}.pay{display:inline-block;padding:12px 18px;border-radius:11px;background:#111827;color:#fff;text-decoration:none;font-weight:700;margin-top:10px}</style></head><body><div class="card" id="app">Loading secure checkout…</div><script>(async()=>{const API='https://api.omniupi.in';const p=new URLSearchParams(location.search),id=p.get('order');const app=document.getElementById('app');if(!id){app.textContent='Invalid checkout order.';return}const token=localStorage.getItem('omniupi_token');if(!token){app.textContent='Please return to OmniUPI and login again.';return}const req=async path=>{const r=await fetch(API+path,{headers:{Accept:'application/json',Authorization:'Bearer '+token}});const d=await r.json();if(!r.ok||d.status===false)throw new Error(d.message||'Checkout unavailable');return d};try{const d=await req('/api/v1/subscriptions/checkout/'+encodeURIComponent(id));const o=d.order;app.innerHTML='<h2>'+o.plan+'</h2><p>Pay ₹'+Number(o.amount).toFixed(2)+' to '+o.upiName+'</p><img class="qr" src="'+o.qrDataUrl+'"><div class="upi"><b>UPI ID</b><br>'+o.upiId+'<br><br><b>Order</b><br>'+o.orderId+'</div><div class="status" id="s">Waiting for payment…</div><a class="pay" href="'+o.paymentUrl+'">Open UPI App</a>';const s=document.getElementById('s');const timer=setInterval(async()=>{try{const x=await req('/api/v1/subscriptions/order/'+encodeURIComponent(id));if(x.order.status==='SUCCESS'){clearInterval(timer);s.textContent='✓ Payment received. Subscription activated.';s.className='status ok'}}catch{}},4000)}catch(e){app.textContent=e.message}})();</script></body></html>
