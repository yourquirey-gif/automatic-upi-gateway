<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f7fb"><title>OmniUPI Subscription Checkout</title><style>*{box-sizing:border-box}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f9fc,#eef3f8);margin:0;min-height:100vh;display:grid;place-items:center;color:#172033}.card{width:min(440px,92vw);background:#fff;border-radius:26px;padding:25px;box-shadow:0 24px 70px #17203318;text-align:center;border:1px solid #e8edf3}.brand{font-weight:900;font-size:14px;letter-spacing:.3px;color:#5963e8}.card h2{margin:8px 0 4px;font-size:24px}.sub{color:#7b8492;font-size:12px;margin:0 0 15px}.qr-wrap{width:266px;height:266px;margin:15px auto;padding:13px;background:#fff;border:1px solid #e4e9ef;border-radius:20px;box-shadow:0 12px 30px #17203312}.qr{width:240px;height:240px;display:block;border-radius:12px}.upi{background:#f7f9fb;padding:12px;border-radius:13px;text-align:left;font-size:12px;line-height:1.5;border:1px solid #edf0f4}.upi code{word-break:break-all}.status{margin:14px 0;padding:12px;border-radius:12px;background:#fff9e8;color:#8a6a12;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px}.spinner{width:14px;height:14px;border:2px solid #e8d99a;border-top-color:#8a6a12;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.pay{display:block;padding:13px 18px;border-radius:13px;background:#111827;color:#fff;text-decoration:none;font-weight:800;margin-top:10px}.success{display:none}.success.show{display:block;animation:fade .25s ease-out}.payment.hide{display:none}.check{width:88px;height:88px;margin:5px auto 14px;border-radius:50%;background:#dcf8e9;color:#17915e;display:grid;place-items:center;font-size:48px;font-weight:900;animation:pop .45s ease-out}.success h2{margin:0 0 5px;font-size:25px}.success p{margin:5px 0;color:#6e7887;font-size:12px}.expiry{margin:15px 0;padding:13px;border-radius:13px;background:#f4f7ff;border:1px solid #dfe5ff}.expiry b{display:block;font-size:17px;color:#4f5bd8;margin-top:4px}.continue{display:block;margin-top:12px;padding:12px;border-radius:12px;background:#4f5bd8;color:#fff;text-decoration:none;font-weight:800}@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}</style></head><body><div class="card" id="app"><div class="brand">ϟ OMNIUPI</div><p class="sub">Loading secure subscription checkout…</p></div><script>(async()=>{const API='https://api.omniupi.in';const p=new URLSearchParams(location.search),id=p.get('order');const app=document.getElementById('app');const token=localStorage.getItem('omniupi_token');if(!id){app.innerHTML='<h2>Invalid checkout</h2><p class="sub">The subscription order is missing.</p>';return}if(!token){app.innerHTML='<h2>Login required</h2><p class="sub">Return to OmniUPI and login again before paying.</p>';return}const req=async path=>{const r=await fetch(API+path,{headers:{Accept:'application/json',Authorization:'Bearer '+token}});const d=await r.json().catch(()=>({}));if(!r.ok||d.status===false)throw new Error(d.message||'Checkout unavailable');return d};const fmt=v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—';try{const d=await req('/api/v1/subscriptions/checkout/'+encodeURIComponent(id));const o=d.order;app.innerHTML='<div class="payment"><div class="brand">ϟ OMNIUPI</div><h2>'+o.plan+'</h2><p class="sub">Scan the QR with any UPI app and complete the payment.</p><div class="qr-wrap"><img class="qr" src="'+o.qrDataUrl+'" alt="UPI payment QR"></div><div class="upi"><b>Amount:</b> ₹'+Number(o.amount).toFixed(2)+'<br><b>UPI ID:</b> <code>'+o.upiId+'</code><br><b>Order:</b> '+o.orderId+'</div><div class="status" id="s"><span class="spinner"></span> Waiting for payment confirmation…</div><a class="pay" href="'+o.paymentUrl+'">Open UPI App</a></div><div class="success" id="success"><div class="check">✓</div><h2>Payment Complete</h2><p>Your subscription has been activated successfully.</p><div class="expiry"><span>Plan</span><b id="plan"></b><span>Expires</span><b id="expiry"></b></div><p id="utr"></p><a class="continue" href="./gateway.html">Continue to Dashboard</a></div>';const s=document.getElementById('s');let tries=0;const timer=setInterval(async()=>{tries++;try{const x=await req('/api/v1/subscriptions/order/'+encodeURIComponent(id));if(x.order.status==='SUCCESS'){clearInterval(timer);document.querySelector('.payment').classList.add('hide');document.getElementById('success').classList.add('show');document.getElementById('plan').textContent=x.order.plan||o.plan;document.getElementById('expiry').textContent=fmt(x.order.expiresAt);document.getElementById('utr').textContent=x.order.utr?'UTR: '+x.order.utr:'Payment verified by OmniUPI Gmail verification';}else if(['FAILED','EXPIRED'].includes(x.order.status)){clearInterval(timer);s.textContent='Payment session expired or failed. Please start a new subscription.';s.className='status';}}catch{}if(tries>=90)clearInterval(timer)},2500)}catch(e){app.innerHTML='<h2>Checkout unavailable</h2><p class="sub">'+String(e.message||'Unable to load payment details.').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>'}})();</script></body></html>
