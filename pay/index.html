<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B95BD"><title>Pay · OmniUPI</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:560px;margin:auto;padding:18px 13px 30px}.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 12px 35px #17203312}.top{color:#fff;padding:22px}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:850}.logo{width:42px;height:42px;border-radius:11px;background:#ffffff28;display:grid;place-items:center;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;background:#fff}.amountLabel{margin-top:25px;font-size:11px;opacity:.8}.amount{font-size:36px;font-weight:900;margin-top:3px}.body{padding:18px}.qrBox{border:1px solid #e7ebf0;border-radius:17px;padding:14px;text-align:center;background:#fafbfc}.qr{width:220px;height:220px;max-width:100%;border-radius:13px;background:#fff}.tag{display:inline-block;background:#fff;border:1px solid #e4e9ef;border-radius:99px;padding:6px 10px;font-size:11px;color:#218ea9;margin-bottom:12px}.upi{display:flex;align-items:center;gap:8px;margin-top:13px;background:#f7f9fb;border:1px solid #e6eaf0;border-radius:12px;padding:10px}.upi code{font-size:12px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.copy{background:#111827;color:#fff}.intents{display:grid;gap:9px;margin-top:15px}.intent{display:flex;align-items:center;gap:11px;height:54px;border:2px solid;border-radius:29px;padding:0 15px;text-decoration:none;color:#243044;font-weight:800}.intent span{margin-left:auto;color:#8d96a3;font-size:11px}.paytm{border-color:#18a7cf}.phonepe{border-color:#6c2aa0}.gpay{border-color:#49ad69}.bhim{border-color:#4c6fd7}.icon{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:900}.i-paytm{background:#0ca4cc}.i-phonepe{background:#67329b}.i-gpay{background:#45a866}.i-bhim{background:#4969c7}.instructions{margin-top:15px;background:#f7f9fb;border-radius:13px;padding:12px;color:#657083;font-size:12px;line-height:1.6}.status{margin-top:15px;border:1px solid #e7ebef;border-radius:13px;padding:12px;text-align:center;background:#fafbfc;color:#6c7786;font-size:12px}.success{color:#159b77;background:#effbf6;border-color:#bfe8d8}.footer{border-top:1px solid #edf0f3;padding:12px 16px;display:flex;justify-content:space-between;color:#8993a0;font-size:10px}.secure{color:#159b77}.err{padding:25px;text-align:center}.hidden{display:none!important}</style></head><body><div class="wrap"><div id="root" class="card"><div class="err">Loading secure checkout…</div></div></div><script>
const API='https://api.omniupi.in';const root=document.getElementById('root');const orderId=new URLSearchParams(location.search).get('order_id');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function copyText(v){navigator.clipboard?.writeText(v).then(()=>{const b=document.getElementById('copy');if(b){b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1400)}})}
async function load(){if(!orderId){root.innerHTML='<div class="err"><h2>Invalid payment link</h2><p>order_id is missing.</p></div>';return}try{const r=await fetch(`${API}/api/v1/public-checkout/${encodeURIComponent(orderId)}`,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.status)throw new Error(d.message||'Checkout unavailable');render(d.result);poll()}catch(e){root.innerHTML=`<div class="err"><h2>Checkout unavailable</h2><p>${esc(e.message)}</p></div>`}}
function render(x){const c=x.checkout,m=x.merchant,logo=c.brandLogo?`<img src="${esc(c.brandLogo)}">`:'ϟ';const inst=c.instructions?`<div class="instructions"><b>Payment Instructions</b><br>${esc(c.instructions).replace(/\n/g,'<br>')}</div>`:'';const upi=c.showUpiId?`<div class="upi"><code>${esc(m.upiId)}</code>${c.showCopyButton?'<button id="copy" class="btn copy" onclick="copyText('+JSON.stringify(m.upiId)+')">Copy</button>':''}</div>`:'';const intents=c.showIntentButtons?`<div class="intents"><a class="intent paytm" href="${esc(x.upiUrl)}"><i class="icon i-paytm">PT</i>Paytm<span>Pay via app ›</span></a><a class="intent phonepe" href="${esc(x.upiUrl)}"><i class="icon i-phonepe">PP</i>PhonePe<span>Pay via app ›</span></a><a class="intent gpay" href="${esc(x.upiUrl)}"><i class="icon i-gpay">G</i>Google Pay<span>Pay via app ›</span></a>${c.showBhim?`<a class="intent bhim" href="${esc(x.upiUrl)}"><i class="icon i-bhim">BH</i>BHIM<span>Pay via app ›</span></a>`:''}</div>`:'';root.innerHTML=`<div class="top" style="background:${esc(c.themeColor)}"><div class="brand"><div class="logo">${logo}</div><span>${esc(c.brandName)}</span></div><div class="amountLabel">Amount to pay</div><div class="amount">₹${esc(x.amount)}</div></div><div class="body">${c.showQrCode?`<div class="qrBox"><span class="tag">▦ Scan & Pay</span><br><img class="qr" src="${esc(x.qrDataUrl)}" alt="UPI QR"><p style="margin:8px 0 0;color:#7b8491;font-size:11px">Scan with any UPI app</p></div>`:''}${upi}${intents}${inst}<div id="status" class="status">Waiting for payment confirmation…</div></div><div class="footer"><span class="secure">🔒 Secure payment</span><span>Powered by <b style="color:${esc(c.themeColor)}">OmniUPI</b></span></div>`}
async function poll(){try{const r=await fetch(`${API}/api/v1/public-checkout/${encodeURIComponent(orderId)}/status`,{cache:'no-store'});const d=await r.json();const x=d.result;if(x?.txnStatus==='SUCCESS'){const s=document.getElementById('status');if(s){s.className='status success';s.textContent='✓ Payment received successfully'}if(x.redirectUrl)setTimeout(()=>location.replace(x.redirectUrl),600)}else if(x?.txnStatus==='FAILED'||x?.txnStatus==='EXPIRED'){const s=document.getElementById('status');if(s){s.textContent=`Payment ${x.txnStatus.toLowerCase()}`}}}catch{}setTimeout(poll,3000)}load();
</script></body></html>
