name: Add Merchant APK Page

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-apk-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch dashboard APK page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/App.jsx')
          text = path.read_text(encoding='utf-8')

          old = '{page===\'apk\'&&<SimplePage icon={Download} title="Merchant APK" text="Merchant application downloads will appear here."/>}'
          new = "{page==='apk'&&<MerchantApkPage/>}"

          if 'function MerchantApkPage()' in text:
              print('Merchant APK page already installed.')
              raise SystemExit(0)

          if old not in text:
              raise SystemExit('Could not find the existing APK placeholder in App.jsx')

          text = text.replace(old, new, 1)

          component = r'''
function MerchantApkPage(){
  const apks=[
    {name:'Paytm Business',version:'v10.5.2',file:'paytm-business-v10.5.2.apk',note:'UPI, QR payments and merchant collections.',tone:'linear-gradient(90deg,#08b8e8,#0878e8)'},
    {name:'PhonePe Business',version:'v8.9.1',file:'phonepe-business-v8.9.1.apk',note:'Merchant QR and payment collection.',tone:'linear-gradient(90deg,#6a24b7,#7c3aed)'},
    {name:'Google Pay Business',version:'v6.7.0',file:'googlepay-business-v6.7.0.apk',note:'Business payment collection application.',tone:'linear-gradient(90deg,#24a96a,#3185ed)'},
    {name:'SMS Forwarder',version:'v1.0.0',file:'sms-forwarder-v1.0.0.apk',note:'Forward selected SMS notifications.',tone:'linear-gradient(90deg,#25a66a,#3b82ed)'},
    {name:'Notification Forwarder',version:'v1.0.0',file:'notification-forwarder-v1.0.0.apk',note:'Forward supported payment notifications.',tone:'linear-gradient(90deg,#159c70,#3185ed)'}
  ];
  return <div className="dash-content" style={{maxWidth:1080,margin:'0 auto'}}>
    <div className="page-back" onClick={()=>history.back()}><ArrowLeft size={17}/> Dashboard</div>
    <div style={{background:'#fff',border:'1px solid #e7eaf1',borderRadius:22,padding:'25px 22px',marginBottom:18,boxShadow:'0 12px 35px #202b4310'}}>
      <div style={{display:'flex',gap:14,alignItems:'center'}}><div style={{width:52,height:52,borderRadius:15,display:'grid',placeItems:'center',background:'linear-gradient(135deg,#5968e7,#19b99b)',color:'#fff'}}><Download size={27}/></div><div><span className="eyebrow">DEVELOPER SETTING</span><h1 style={{margin:'4px 0',color:'#273145'}}>Merchant APK Downloads</h1><p style={{margin:0,color:'#7f8999'}}>Download the latest merchant applications from one place.</p></div></div>
    </div>
    <div style={{display:'grid',gap:18}}>
      {apks.map(a=><section key={a.file} style={{background:'#fff',border:'1px solid #e7eaf1',borderRadius:22,padding:18,boxShadow:'0 10px 28px #202b430d'}}>
        <div style={{background:'#f7f9fc',borderRadius:16,minHeight:105,display:'grid',placeItems:'center',fontSize:23,fontWeight:900,color:'#273145'}}>ϟ <span style={{marginLeft:8}}>{a.name}</span></div>
        <h2 style={{margin:'18px 0 5px',color:'#273145'}}>{a.name}</h2>
        <p style={{margin:'0 0 14px',color:'#7f8999',fontSize:15}}>{a.note}</p>
        <div style={{background:'#f7f9fc',borderRadius:12,padding:'13px 14px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:10}}><span style={{color:'#7b8595'}}>Latest Version</span><b style={{color:'#273145'}}>{a.version}</b></div>
        <a href={'./merchant-apk/'+a.file} download style={{display:'flex',justifyContent:'center',alignItems:'center',gap:8,marginTop:14,textDecoration:'none',borderRadius:13,padding:14,color:'#fff',fontWeight:850,fontSize:16,background:a.tone}}><Download size={18}/> Download APK</a>
      </section>)}
    </div>
  </div>
}
'''
          marker = '\nfunction SimplePage('
          text = text.replace(marker, '\n'+component+marker, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patched page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add merchant APK download page"
          git push
