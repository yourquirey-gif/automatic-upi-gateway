name: Wire user payment links to backend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[payment-link-order-id]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch payment link management
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/App.jsx')
          text = path.read_text(encoding='utf-8')
          text = text.replace("import {login,logout,register} from './api';", "import {login,logout,register,api} from './api';")

          payment_link = r'''function PaymentLinkPage({openPage}){
            const[customer,setCustomer]=useState(''),[mobile,setMobile]=useState(''),[amount,setAmount]=useState(''),[remark,setRemark]=useState(''),[links,setLinks]=useState([]),[loading,setLoading]=useState(false),[toast,setToast]=useState('');
            const load=async()=>{try{const d=await api('/orders?limit=100');setLinks((d.orders||[]).filter(x=>!/^VERIFY_/.test(String(x.orderId||''))))}catch(e){setToast(e.message||'Unable to load payment links')}};
            useEffect(()=>{load()},[]);
            const generate=async()=>{const n=Number(amount);if(!customer.trim()||!/^[0-9]{10}$/.test(mobile)||!Number.isFinite(n)||n<1){setToast('Enter customer name, valid mobile and amount.');return}setLoading(true);setToast('');try{const d=await api('/orders/payment-link',{method:'POST',body:JSON.stringify({customerMobile:mobile,amount:n,remark:remark.trim()})});await load();setCustomer('');setMobile('');setAmount('');setRemark('');setToast(`Payment link generated. Order ID: ${d.result.orderId}`)}catch(e){setToast(e.message||'Unable to create payment link')}finally{setLoading(false)}};
            const copy=async l=>{try{await navigator.clipboard.writeText(l);setToast('Payment link copied.')}catch{setToast(l)}};
            return <div className="dash-content" style={{maxWidth:1080,margin:'0 auto'}}><div className="page-back" onClick={()=>openPage('home')}><ArrowLeft size={17}/> Dashboard</div><div style={{background:'linear-gradient(135deg,#5968e7,#7b4daf)',color:'#fff',borderRadius:22,padding:'25px 22px',marginBottom:18,boxShadow:'0 18px 45px #5d5cbd2e'}}><div style={{display:'flex',gap:12,alignItems:'center'}}><Link2 size={36}/><div><h1 style={{margin:0,fontSize:27}}>Payment Link Management</h1><p style={{margin:'5px 0 0',opacity:.9}}>Create and manage backend-verified OmniUPI payment links</p></div></div></div>{toast&&<div className="dash-toast">{toast}<button onClick={()=>setToast('')}><X size={15}/></button></div>}<section style={cardBox}><div style={sectionHead}><div><h2 style={title}>＋ Create New Payment Link</h2><p style={sub}>Every link creates a persistent backend Order ID used for Gmail verification.</p></div><b style={{color:'#c88700'}}>◷ 5 min expiry</b></div><div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}><FormField label="CUSTOMER NAME" value={customer} set={setCustomer} placeholder="Enter customer name"/><FormField label="MOBILE NUMBER" value={mobile} set={v=>setMobile(v.replace(/\D/g,'').slice(0,10))} placeholder="10-digit mobile"/><FormField label="AMOUNT (₹)" value={amount} set={setAmount} placeholder="0.00"/><FormField label="REMARK (OPTIONAL)" value={remark} set={setRemark} placeholder="e.g., Gift, Deposit"/></div><button onClick={generate} disabled={loading} style={{...gradient,opacity:loading?.65:1}}>{loading?'Creating Order…':'⚡ Generate Link'}</button></section><section style={{...cardBox,marginTop:18}}><div style={sectionHead}><div><h2 style={title}>☷ My Links</h2><p style={sub}>Order IDs are stored in MongoDB and remain tied to the merchant account.</p></div><b style={{color:'#5968df'}}>Total: {links.length}</b></div>{links.length===0?<div style={{textAlign:'center',padding:45,color:'#8b94a4'}}><Link2 size={46}/><h3 style={{color:'#273145'}}>No Links Found</h3><p>Create your first link to get started.</p></div>:links.map(l=><div key={l._id||l.orderId} style={row}><div style={{minWidth:0}}><b>{l.orderId} • ₹{Number(l.amount).toFixed(2)}</b><small style={{display:'block',color:'#7d8798',marginTop:4}}>{l.status} • {new Date(l.createdAt).toLocaleString('en-IN')}</small><span style={{display:'block',color:'#5c67dc',fontSize:12,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',marginTop:5}}>{l.paymentUrl}</span></div><div style={{display:'flex',gap:7}}><button style={small} onClick={()=>copy(l.paymentUrl)}>Copy</button><button style={small} onClick={()=>open(l.paymentUrl,'_blank')}>Open</button></div></div>)}</section></div>}
function FormField'''

          public_page = r'''function PublicPaymentPage({route}){const q=new URLSearchParams(route.slice(4)),orderId=q.get('order_id')||q.get('id')||'';useEffect(()=>{if(orderId){location.replace(`https://omniupi.in/pay.html?order_id=${encodeURIComponent(orderId)}`)}},[orderId]);return <div style={{minHeight:'100vh',display:'grid',placeItems:'center',fontFamily:'Inter,system-ui,sans-serif',color:'#273145'}}>Opening secure OmniUPI payment checkout…</div>}

function SimplePage'''

          text, n1 = re.subn(r'function PaymentLinkPage\(\{openPage\}\)\{.*?\}\nfunction FormField', payment_link, text, count=1, flags=re.S)
          if n1 != 1: raise SystemExit('PaymentLinkPage replacement failed')
          text, n2 = re.subn(r'function PublicPaymentPage\(\{route\}\)\{.*?\}\nfunction SimplePage', public_page, text, count=1, flags=re.S)
          if n2 != 1: raise SystemExit('PublicPaymentPage replacement failed')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build frontend
        working-directory: frontend
        run: npm install && npm run build

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.jsx
          git commit -m "Wire payment links to persistent orders [payment-link-order-id]"
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/patch-payment-link-management.yml
          git commit -m "Remove one-time payment link patch workflow [payment-link-order-id]"
          git push
