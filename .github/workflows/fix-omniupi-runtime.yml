name: OmniUPI runtime fallback

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add startup fallback and cache-bust frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')

          fallback = r'''<div id="root"><div id="omni-startup-fallback" style="min-height:100vh;background:linear-gradient(145deg,#f7f8ff,#f0fffb);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box"><div style="width:min(720px,100%);text-align:center;background:#ffffffee;border:1px solid #e8ebf3;border-radius:28px;padding:42px 24px;box-shadow:0 24px 70px #17213a18"><div style="width:64px;height:64px;margin:0 auto 18px;border-radius:20px;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:900;background:linear-gradient(135deg,#6269e8,#19b99a)">ϟ</div><div style="font-size:11px;letter-spacing:.14em;font-weight:900;color:#6269e8">OMNIUPI</div><h1 style="font-size:clamp(28px,6vw,46px);line-height:1.05;margin:10px 0 12px">UPI Payments Gateway</h1><p style="max-width:560px;margin:0 auto 24px;color:#6f7888;line-height:1.65">Secure UPI payment infrastructure for modern businesses. Loading your merchant workspace…</p><div style="width:min(300px,100%);height:5px;background:#e9edf5;border-radius:99px;overflow:hidden;margin:0 auto 22px"><span style="display:block;width:40%;height:100%;border-radius:99px;background:linear-gradient(90deg,#6269e8,#19b99a);animation:omniFallbackProgress 1.5s infinite ease-in-out"></span></div><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 20px;color:#fff;background:linear-gradient(90deg,#6269e8,#19b798);font-weight:800;cursor:pointer">Reload OmniUPI</button></div></div><style>@keyframes omniFallbackProgress{0%{transform:translateX(-150%)}100%{transform:translateX(350%)}}</style></div>'''

          if '<div id="root"></div>' in s:
              s = s.replace('<div id="root"></div>', fallback, 1)

          marker = '<script>window.__OMNIUPI_STARTUP_GUARD__=true;window.addEventListener("error",function(){var r=document.getElementById("root");if(r&&!r.querySelector("#omni-startup-fallback")){r.innerHTML=' 
          if 'window.__OMNIUPI_STARTUP_GUARD__' not in s:
              guard = '''<script>window.__OMNIUPI_STARTUP_GUARD__=true;window.__OMNIUPI_STARTUP_ERROR__=false;window.addEventListener("error",function(){window.__OMNIUPI_STARTUP_ERROR__=true;});window.addEventListener("unhandledrejection",function(){window.__OMNIUPI_STARTUP_ERROR__=true;});</script>'''
              s = s.replace('</head>', guard + '</head>', 1)

          s = s.replace('/src/main.jsx?v=20260819-1', '/src/main.jsx?v=20260820-1')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: prevent blank OmniUPI startup screen"
          git push
