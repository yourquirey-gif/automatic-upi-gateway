name: Apply OmniUPI branding

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/src/App.jsx"
      - "frontend/index.html"
      - ".github/workflows/omniupi-brand.yml"

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace legacy frontend branding
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ["frontend/src/App.jsx", "frontend/index.html"]:
              p = Path(name)
              if p.exists():
                  s = p.read_text(encoding="utf-8")
                  s = s.replace("AutoGateway", "OmniUPI")
                  p.write_text(s, encoding="utf-8")
          PY

      - name: Commit branding changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No legacy branding found."
            exit 0
          fi
          git add frontend/src/App.jsx frontend/index.html
          git commit -m "Rebrand landing page to OmniUPI"
          git push
