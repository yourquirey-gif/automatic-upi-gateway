name: OmniUPI branding compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm canonical branding
        run: |
          grep -R "OmniUPI" index.html >/dev/null
          echo "OmniUPI branding is active."
