<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmniUPI Blog</title><meta name="description" content="OmniUPI blog article"><style>body{margin:0;background:#f6f8fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:820px;margin:auto;padding:26px 18px 70px}.nav{display:flex;justify-content:space-between;margin-bottom:35px}.logo{font-weight:900;color:#0b95bd;font-size:21px}.back{color:#5267f3;text-decoration:none;font-size:13px}.hero{background:#fff;border:1px solid #e7ebf2;border-radius:22px;overflow:hidden}.cover{width:100%;max-height:470px;object-fit:cover;display:block}.head{padding:30px}.meta{font-size:12px;color:#788497;margin-bottom:10px}.head h1{font-size:42px;line-height:1.14;letter-spacing:-.04em;margin:0 0 14px}.excerpt{font-size:16px;color:#687589;line-height:1.7}.article{margin-top:22px;background:#fff;border:1px solid #e7ebf2;border-radius:22px;padding:34px;line-height:1.8;font-size:16px}.article h2{font-size:28px;margin-top:32px}.article h3{font-size:21px;margin-top:26px}.article img{max-width:100%;height:auto;border-radius:12px}.article a{color:#5267f3}.article blockquote{border-left:4px solid #0b95bd;margin:25px 0;padding:8px 18px;background:#f5f9fb;color:#59677b}.notfound{text-align:center;padding:80px 10px;color:#758196}@media(max-width:600px){.head h1{font-size:31px}.article,.head{padding:22px}.article{font-size:15px}}</style></head><body><main class="wrap"><nav class="nav"><div class="logo">OmniUPI</div><a class="back" href="/blog.html">← All blogs</a></nav><div id="app" class="notfound">Loading article…</div></main><script>const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||new URLSearchParams(location.search).get('slug')||'');const API='https://api.omniupi.in/api/v1/blogs/';async function load(){const r=await fetch(API+encodeURIComponent(slug));const d=await r.json();if(!r.ok||!d.blog){document.title='Blog not found — OmniUPI';document.getElementById('app').innerHTML='<div class="notfound"><h1>Blog not found</h1><p>The article may have been unpublished or removed.</p><a class="back" href="/blog.html">Back to blogs</a></div>';return}const b=d.blog;document.title=(b.metaTitle||b.title)+' — OmniUPI';document.querySelector('meta[name=description]').content=b.metaDescription||b.excerpt||'';document.getElementById('app').className='';document.getElementById('app').innerHTML=`<header class="hero">${b.featuredImage?`<img class="cover" src="${safe(b.featuredImage)}" alt="${safe(b.title)}">`:''}<div class="head"><div class="meta">${safe(b.category||'General')} · ${date(b.publishedAt)} · ${safe(b.author||'OmniUPI')}</div><h1>${safe(b.title)}</h1><div class="excerpt">${safe(b.excerpt||'')}</div></div></header><article class="article">${b.contentHtml}</article>`}function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function date(s){return s?new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'}):''}load().catch(()=>document.getElementById('app').innerHTML='<div class="notfound"><h1>Something went wrong</h1><a class="back" href="/blog.html">Back to blogs</a></div>');</script></body></html>
