<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniUPI Admin · Blog Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:20px}.top h1{margin:0;font-size:28px}.muted{color:#7b8596;font-size:13px}.grid{display:grid;grid-template-columns:1.5fr .7fr;gap:18px}.card{background:#fff;border:1px solid #e7eaf1;border-radius:15px;padding:20px;box-shadow:0 6px 22px #17203308}.field{display:grid;gap:7px;margin-bottom:14px}.field label{font-size:11px;font-weight:800;color:#4e596b}.field input,.field textarea,.field select{width:100%;border:1px solid #dfe3eb;border-radius:9px;padding:11px 12px;font:inherit;font-size:13px}.field textarea{min-height:90px;resize:vertical}.editor{min-height:400px;border:1px solid #dfe3eb;border-radius:9px;padding:16px;line-height:1.75;outline:0}.editor img{max-width:100%;border-radius:10px}.tools{display:flex;gap:5px;flex-wrap:wrap;border:1px solid #dfe3eb;border-bottom:0;border-radius:9px 9px 0 0;padding:7px;background:#f8f9fb}.tool,.btn{border:1px solid #dfe3eb;background:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:700;font-size:12px}.primary{background:linear-gradient(135deg,#5267f3,#704fdd);color:#fff;border:0}.danger{color:#c73c3c}.actions{display:flex;gap:7px;flex-wrap:wrap}.list{margin-top:18px}.item{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;border:1px solid #e6e9ef;border-radius:12px;padding:10px;margin-top:10px}.item img{width:90px;height:62px;object-fit:cover;border-radius:8px;background:#eef1f5}.item b{font-size:13px}.item small{display:block;color:#8992a1;font-size:10px;margin-top:4px}.login{max-width:420px;margin:80px auto}.notice{position:fixed;right:18px;bottom:18px;background:#172033;color:#fff;padding:12px 15px;border-radius:9px;display:none}.notice.show{display:block}@media(max-width:850px){.grid{grid-template-columns:1fr}.wrap{padding:14px}.item{grid-template-columns:70px 1fr}.item img{width:70px;height:52px}.item .actions{grid-column:1/-1}}
</style></head>
<body>
<div id="login" class="card login" hidden><h2>Admin login required</h2><p class="muted">Use the same administrator credentials as OmniUPI Admin.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="doLogin()">Login</button></div>
<div id="app" class="wrap">
<div class="top"><div><h1>Blog Manager</h1><p class="muted">Create SEO-friendly articles, manage drafts and publish instantly.</p></div><button class="btn" onclick="resetForm()">+ New Blog</button></div>
<div class="grid"><section class="card"><div class="field"><label>Blog Title</label><input id="title" placeholder="Complete Guide to UPI Payment Gateway"></div><div class="field"><label>Excerpt / Short Description</label><textarea id="excerpt" maxlength="500"></textarea></div><div class="field"><label>Content</label><div class="tools"><button class="tool" onclick="cmd('bold')"><b>B</b></button><button class="tool" onclick="cmd('italic')"><i>I</i></button><button class="tool" onclick="cmd('formatBlock','h2')">H2</button><button class="tool" onclick="cmd('formatBlock','h3')">H3</button><button class="tool" onclick="cmd('insertUnorderedList')">• List</button><button class="tool" onclick="cmd('insertOrderedList')">1. List</button><button class="tool" onclick="addLink()">Link</button><button class="tool" onclick="addImage()">Image</button></div><div id="editor" class="editor" contenteditable="true"><h2>Start writing your article…</h2><p>Write the complete blog here.</p></div></div><div class="actions"><button class="btn" onclick="save('DRAFT')">Save Draft</button><button class="btn primary" onclick="save('PUBLISHED')">Publish Blog</button></div></section>
<aside class="card"><div class="field"><label>Featured Image URL</label><input id="featuredImage"></div><div class="field"><label>Category</label><input id="category" value="UPI & Payments"></div><div class="field"><label>Tags</label><input id="tags" placeholder="upi, payment gateway, fintech"></div><div class="field"><label>Author</label><input id="author" value="OmniUPI"></div><div class="field"><label>SEO Meta Title</label><input id="metaTitle"></div><div class="field"><label>SEO Meta Description</label><textarea id="metaDescription"></textarea></div></aside></div>
<section class="card list"><div class="top"><div><h2 style="margin:0;font-size:17px">All Blogs</h2><p class="muted">Published and draft articles</p></div><button class="btn" onclick="loadBlogs()">Refresh</button></div><div id="list">Loading…</div></section>
</div><div id="notice" class="notice"></div>
<script>
const API='https://api.omniupi.in/api/v1';let editing=null;
const $=id=>document.getElementById(id);function token(){return localStorage.getItem('gateway_admin_token')||''}
async function req(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',Authorization:'Bearer '+token()};const r=await fetch(API+path,opt);const d=await r.json().catch(()=>({message:'Invalid server response'}));if(r.status===401||r.status===403)throw Error('AUTH');if(!r.ok||d.status===false)throw Error(d.message||'Request failed');return d}
function notice(x){$('notice').textContent=x;$('notice').classList.add('show');setTimeout(()=>$('notice').classList.remove('show'),2500)}
function cmd(c,v){document.execCommand(c,false,v);$('editor').focus()}function addLink(){const u=prompt('Link URL');if(u)cmd('createLink',u)}function addImage(){const u=prompt('Image URL');if(u)cmd('insertImage',u)}
function resetForm(){editing=null;$('title').value='';$('excerpt').value='';$('featuredImage').value='';$('category').value='UPI & Payments';$('tags').value='';$('author').value='OmniUPI';$('metaTitle').value='';$('metaDescription').value='';$('editor').innerHTML='<h2>Start writing your article…</h2><p>Write the complete blog here.</p>';scrollTo({top:0,behavior:'smooth'})}
async function save(status){try{const payload={title:$('title').value,excerpt:$('excerpt').value,contentHtml:$('editor').innerHTML,featuredImage:$('featuredImage').value,category:$('category').value,tags:$('tags').value,author:$('author').value,metaTitle:$('metaTitle').value||$('title').value,metaDescription:$('metaDescription').value||$('excerpt').value,featured:false,status};const d=await req(editing?'/v1/admin/blogs/'+editing:'/v1/admin/blogs',{method:editing?'PUT':'POST',body:JSON.stringify(payload)});editing=d.blog?._id||editing;notice(status==='PUBLISHED'?'Blog published successfully':'Draft saved');loadBlogs()}catch(e){if(e.message==='AUTH')showLogin();else notice(e.message)}}
async function loadBlogs(){try{const d=await req('/v1/admin/blogs');$('list').innerHTML=(d.blogs||[]).map(b=>`<div class="item"><img src="${esc(b.featuredImage||'')}" alt=""><div><b>${esc(b.title)}</b><small>${esc(b.category||'')} · ${b.status} · ${esc(b.slug||'')}</small></div><div class="actions"><button class="btn" onclick="editBlog('${b._id}')">Edit</button><button class="btn danger" onclick="deleteBlog('${b._id}')">Delete</button></div></div>`).join('')||'<div class="muted" style="padding:25px;text-align:center">No blogs yet.</div>'}catch(e){if(e.message==='AUTH')showLogin();else $('list').textContent=e.message}}
async function editBlog(id){try{const d=await req('/v1/admin/blogs');const b=(d.blogs||[]).find(x=>x._id===id);if(!b)return;editing=id;$('title').value=b.title||'';$('excerpt').value=b.excerpt||'';$('editor').innerHTML=b.contentHtml||'';$('featuredImage').value=b.featuredImage||'';$('category').value=b.category||'General';$('tags').value=(b.tags||[]).join(', ');$('author').value=b.author||'OmniUPI';$('metaTitle').value=b.metaTitle||'';$('metaDescription').value=b.metaDescription||'';scrollTo({top:0,behavior:'smooth'})}catch(e){notice(e.message)}}
async function deleteBlog(id){if(!confirm('Delete this blog permanently?'))return;try{await req('/v1/admin/blogs/'+id,{method:'DELETE'});notice('Blog deleted');loadBlogs()}catch(e){notice(e.message)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showLogin(){$('app').style.display='none';$('login').hidden=false}async function doLogin(){try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const d=await r.json();if(!r.ok||!d.token)throw Error(d.message||'Login failed');localStorage.setItem('gateway_admin_token',d.token);$('login').hidden=true;$('app').style.display='block';loadBlogs()}catch(e){notice(e.message)}}
if(!token())showLogin();else loadBlogs();
</script></body></html>
